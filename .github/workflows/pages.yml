name: Publish game to GitHub Pages

# Mirrors the development branch to gh-pages, which GitHub Pages serves
# (Settings -> Pages -> Deploy from a branch -> gh-pages / root).
on:
  push:
    branches: ["claude/hopeful-cori-u45432"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to gh-pages
        run: git push --force origin HEAD:gh-pages
